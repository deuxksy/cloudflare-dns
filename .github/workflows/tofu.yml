name: OpenTofu

on:
  push:
    branches: [main]
    paths:
      - domain/zzizily/**
      - domain/zetlabs/**
  pull_request:
    paths:
      - domain/zzizily/**
      - domain/zetlabs/**
  workflow_dispatch:

concurrency:
  group: tofu-${{ github.ref }}
  # main push의 apply는 취소하지 않음 — R2 backend에 state lock이 없어
  # 취소/신규 run 경합 시 state 손상 위험. 취소는 PR 검증 run에만 허용.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domain/zzizily

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_domain: ${{ secrets.CLOUDFLARE_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      - name: tofu fmt
        run: tofu fmt -check

      - name: tofu init
        run: tofu init

      - name: tofu validate
        run: tofu validate -no-color

      - name: tofu plan
        id: plan
        if: github.event_name == 'pull_request'
        run: tofu plan -no-color
        continue-on-error: true

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "opentofu\n${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### OpenTofu Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### OpenTofu Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### OpenTofu Validation 🤖\`${{ steps.validate.outcome }}\`
            #### OpenTofu Plan 📖\`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>
            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`
            </details>
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: tofu apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: tofu apply -auto-approve

  tofu-zetlabs:
    name: OpenTofu (zetlabs.net)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domain/zetlabs

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID_ZETLABS }}
      TF_VAR_cloudflare_domain: zetlabs.net

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      - name: tofu fmt
        run: tofu fmt -check

      - name: tofu init
        run: tofu init

      - name: tofu validate
        run: tofu validate -no-color

      - name: tofu plan
        id: plan
        if: github.event_name == 'pull_request'
        run: tofu plan -no-color
        continue-on-error: true

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "opentofu (zetlabs.net)\n${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### [zetlabs.net] OpenTofu Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### [zetlabs.net] OpenTofu Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### [zetlabs.net] OpenTofu Validation 🤖\`${{ steps.validate.outcome }}\`
            #### [zetlabs.net] OpenTofu Plan 📖\`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>
            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`
            </details>
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: tofu apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: tofu apply -auto-approve
