[hooks]
enter = "git pull --ff-only"

[tools]
opentofu = "1.13.10"
sops = "3.13.3"
age = "1.3.2"

[env]
_.file = { path = ".env", redact = true }

[tasks.validate]
description = "두 도메인 OpenTofu 포맷 및 설정 검증"
run = """
set -euo pipefail
for d in domain/zzizily domain/zetlabs; do
  echo "=== $d ==="
  (cd "$d" && tofu fmt -check && tofu validate -no-color)
done
"""

[tasks.plan]
description = "두 도메인 OpenTofu plan (로컬 apply 금지)"
run = """
set -euo pipefail
for d in domain/zzizily domain/zetlabs; do
  echo "=== $d ==="
  (cd "$d" && tofu init -no-color && tofu plan -no-color)
done
"""

[tasks.encrypt]
description = ".env를 binary→json 포맷으로 .env.sops 암호화"
run = "sops --input-type binary --output-type json -e .env > .env.sops"

[tasks.decrypt]
description = ".env.sops를 .env로 복호화"
run = "sops --input-type json --output-type binary -d .env.sops > .env"
